services:

  localrag:
    build: .
    container_name: localrag-service
    command: python3 rag.py
    ports:
      - "5002:5002"
    volumes:
      - .:/app                                        # ホストコード → 自動反映
      - ${OBSIDIAN_PATH:-./output}:/app/data
      - ./rag_db:/app/rag_db
    environment:
      - OLLAMA_BASE=${OLLAMA_BASE:-http://host.docker.internal:11434}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - CHAT_MODEL=${CHAT_MODEL:-gemma3:27b}
      - CHROMA_DIR=/app/rag_db
      - OUTPUT_DIR=/app/data
      - LANG_UI=${LANG_UI:-ja}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - ai-network
    restart: unless-stopped

  council:
    build: .
    container_name: council-service
    command: python3 app.py
    ports:
      - "5010:5000"
    volumes:
      - .:/app                                        # ホストコード → 自動反映
      - ${OBSIDIAN_PATH:-./output}:/app/data
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - OUTPUT_DIR=/app/data
    networks:
      - ai-network
    restart: unless-stopped

  wisemen:
    build: .
    container_name: wisemen-service
    command: python3 wisemen.py
    ports:
      - "5001:5001"
    volumes:
      - .:/app                                        # ホストコード → 自動反映
      - ${OBSIDIAN_PATH:-./output}:/app/data
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - OUTPUT_DIR=/app/data
    networks:
      - ai-network
    restart: unless-stopped

  webresearcher:
    build: .
    container_name: webresearcher-service
    command: python3 webresearcher.py
    ports:
      - "5003:5003"
    volumes:
      - .:/app
      - ${OBSIDIAN_PATH:-./output}:/app/data
    environment:
      - OLLAMA_BASE=${OLLAMA_BASE:-http://host.docker.internal:11434}
      - CHAT_MODEL=${CHAT_MODEL:-gemma3:27b}
      - DUCKDUCKGO_API_KEY=${DUCKDUCKGO_API_KEY:-}
      - OUTPUT_DIR=/app/data
      - RAG_SERVICE_URL=http://localrag:5002
    networks:
      - ai-network
    restart: unless-stopped
    depends_on:
      - localrag

networks:
  ai-network:
    driver: bridge
